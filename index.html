<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verizon · Family Plan</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --text: #0f0f0f;
    --sub: #888888;
    --light: #f0f0f0;
    --border: #e8e8e8;
    --up: #c0392b;
    --down: #1a7f4b;
    --warn-bg: #fffbeb;
    --warn-text: #854d0e;
    --success: #1a7f4b;
    --fail: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .topbar-title { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
  .topbar-sub   { font-size: 13px; color: var(--sub); }

  .page { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }

  /* Month pills */
  .month-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 28px; }
  .month-pill {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 13px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 13px; font-weight: 500; color: var(--sub);
    cursor: pointer;
  }
  .month-pill:hover { border-color: #bbb; color: var(--text); }
  .month-pill.active { background: var(--text); border-color: var(--text); color: #fff; }
  .pill-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .pill-dot.success { background: var(--success); }
  .pill-dot.failed  { background: var(--fail); }
  .month-pill.active .pill-dot.success { background: #6ee7a0; }
  .month-pill.active .pill-dot.failed  { background: #fca5a5; }

  /* Venmo hero */
  .venmo-hero { margin-bottom: 36px; }
  .venmo-hero .label { font-size: 12px; font-weight: 500; color: var(--sub); letter-spacing: 0.02em; margin-bottom: 4px; }
  .venmo-hero .big-amount { font-size: 64px; font-weight: 800; letter-spacing: -3px; line-height: 1; color: var(--text); margin-bottom: 8px; }
  .venmo-hero .breakdown { font-size: 14px; color: var(--sub); }
  .venmo-hero .breakdown strong { color: var(--text); font-weight: 600; }

  .divider { height: 1px; background: var(--border); margin: 28px 0; }
  .sh { font-size: 12px; font-weight: 600; color: var(--sub); letter-spacing: 0.04em; margin-bottom: 14px; text-transform: uppercase; }

  /* People grid */
  .people-row {
    display: grid; grid-template-columns: repeat(2,1fr);
    gap: 1px; background: var(--border);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    margin-bottom: 8px;
  }
  @media (min-width: 480px) { .people-row { grid-template-columns: repeat(3,1fr); } }
  @media (min-width: 680px) { .people-row { grid-template-columns: repeat(5,1fr); } }

  .person-cell { background: var(--surface); padding: 16px 16px 14px; }
  .person-cell.hi { background: #f9f9f9; }
  .pc-name { font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 5px; }
  .pc-amt  { font-size: 24px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; color: var(--text); }
  .pc-delta { font-size: 11px; margin-top: 5px; }
  .pc-delta.up   { color: var(--up); }
  .pc-delta.down { color: var(--down); }
  .pc-delta.flat { color: var(--sub); }
  .ot-badge { display: inline-block; margin-top: 6px; background: var(--warn-bg); color: var(--warn-text); font-size: 10px; font-weight: 700; border-radius: 4px; padding: 2px 6px; }

  .footnote { font-size: 12px; color: var(--sub); }

  /* Device payments */
  .device-item { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .device-item:last-child { border-bottom: none; }
  .device-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
  .device-who   { font-weight: 700; font-size: 14px; }
  .device-model { font-size: 13px; color: var(--sub); margin-top: 1px; }
  .device-right { text-align: right; flex-shrink: 0; }
  .device-bal     { font-size: 15px; font-weight: 700; color: var(--text); }
  .device-bal-sub { font-size: 11px; color: var(--sub); margin-top: 1px; }
  .bar-track { height: 4px; background: var(--light); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
  .bar-fill  { height: 100%; background: var(--text); border-radius: 99px; }
  .bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); }

  /* History table */
  .table-wrap { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
  thead th {
    padding: 10px 14px; text-align: left;
    font-size: 11px; font-weight: 600; color: var(--sub);
    letter-spacing: 0.04em; text-transform: uppercase;
    border-bottom: 1px solid var(--border); background: #f7f7f7;
    white-space: nowrap;
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafafa; }
  .td-month  { font-weight: 600; font-size: 13px; }
  .td-venmo  { font-weight: 700; }
  .td-total  { color: var(--sub); }
  .ot-flag { display: inline-block; background: var(--warn-bg); color: var(--warn-text); font-size: 9px; font-weight: 700; border-radius: 3px; padding: 1px 4px; margin-left: 3px; vertical-align: middle; }

  /* Status badge */
  .status-ok   { color: var(--success); font-weight: 700; font-size: 13px; }
  .status-fail { color: var(--fail); font-weight: 700; font-size: 13px; cursor: help; }

  /* Error banner */
  .error-banner {
    background: #fff5f5; border: 1px solid #fecaca;
    border-radius: 10px; padding: 14px 16px;
    margin-bottom: 20px; font-size: 13px; color: var(--fail);
  }
  .error-banner strong { display: block; margin-bottom: 4px; }

  /* Empty state */
  .empty-state { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); padding: 60px 24px; text-align: center; margin-top: 16px; }
  .empty-state h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .empty-state p  { font-size: 14px; color: var(--sub); margin-top: 6px; }
  .empty-state code { background: var(--light); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Verizon Family Plan</span>
  <span class="topbar-sub">223893379-00001</span>
</div>

<div class="page" id="app">
  <p style="color:#aaa;margin-top:12px;">Loading...</p>
</div>

<script>
const PEOPLE = ['Jeff','Koko','Zach','Alex','Beth'];
const money  = n => '$' + Math.abs(parseFloat(n) || 0).toFixed(2);

function delta(cur, prev) {
  if (prev == null) return null;
  const d = parseFloat(cur) - parseFloat(prev);
  if (Math.abs(d) < 0.02) return { label: 'same as last month', cls: 'flat' };
  return d > 0
    ? { label: `+${money(d)} vs last month`, cls: 'up' }
    : { label: `-${money(d)} vs last month`, cls: 'down' };
}

function getLine(bill, person) {
  return (bill.lines || []).find(l => l.person === person) || null;
}

function getTotal(bill, person) {
  const l = getLine(bill, person);
  return l ? parseFloat(l.total || 0) : null;
}

function render(bills, statusMap) {
  const app = document.getElementById('app');

  if (!bills.length) {
    app.innerHTML = `
      <div class="empty-state">
        <h2>No billing data yet</h2>
        <p>Drag a Verizon PDF into the <code>inbox/</code> folder on GitHub.</p>
        <p style="margin-top:8px;">The pipeline will process it automatically and update this page.</p>
      </div>`;
    return;
  }

  // bills already sorted newest first from data.json
  let activeIdx = 0;

  function buildPage(idx) {
    const bill = bills[idx];
    const prev = idx + 1 < bills.length ? bills[idx + 1] : null;
    const month = bill.bill_month;

    const jeffAmt = getTotal(bill, 'Jeff') || 0;
    const kokoAmt = getTotal(bill, 'Koko') || 0;
    const venmo   = jeffAmt + kokoAmt;
    const due     = bill.due_date || '';

    // Month pills
    const pills = bills.map((b, i) => {
      const st = statusMap[b.bill_month];
      const dotClass = st ? (st.status === 'success' ? 'success' : 'failed') : '';
      const dot = dotClass ? `<span class="pill-dot ${dotClass}"></span>` : '';
      return `<button class="month-pill${i === idx ? ' active' : ''}" onclick="go(${i})">${dot}${b.bill_month}</button>`;
    }).join('');

    // Failed bill banner
    const st = statusMap[month];
    const errorBanner = (st && st.status === 'failed')
      ? `<div class="error-banner"><strong>Processing issue — ${month}</strong>${st.error || 'Validation failed. Check the bill manually.'}</div>`
      : '';

    // Person cells
    const personCells = PEOPLE.map(p => {
      const tot = getTotal(bill, p);
      if (tot === null) return '';
      const d   = delta(tot, prev ? getTotal(prev, p) : null);
      const ln  = getLine(bill, p);
      const hasOT = ln && Math.abs(parseFloat(ln.one_time_amount || 0)) > 0.01;
      const hi  = p === 'Jeff' || p === 'Koko';
      return `
        <div class="person-cell${hi ? ' hi' : ''}">
          <div class="pc-name">${p}</div>
          <div class="pc-amt">${money(tot)}</div>
          ${d ? `<div class="pc-delta ${d.cls}">${d.label}</div>` : ''}
          ${hasOT ? `<span class="ot-badge">one-time</span>` : ''}
        </div>`;
    }).join('');

    // Device cards
    const deviceItems = ['Jeff','Koko','Alex'].map(p => {
      const ln = getLine(bill, p);
      if (!ln || !parseInt(ln.device_payment_total)) return '';
      const payN = parseInt(ln.device_payment_number) || 0;
      const payT = parseInt(ln.device_payment_total)  || 36;
      const bal  = parseFloat(ln.device_balance_remaining) || 0;
      const net  = parseFloat(ln.net_device_cost) || 0;
      const pct  = Math.min(100, Math.round(payN / payT * 100));
      return `
        <div class="device-item">
          <div class="device-top">
            <div>
              <div class="device-who">${p}</div>
              <div class="device-model">${ln.device} &nbsp;·&nbsp; ${money(net)}/mo net</div>
            </div>
            <div class="device-right">
              <div class="device-bal">${money(bal)}</div>
              <div class="device-bal-sub">remaining</div>
            </div>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-labels"><span>${pct}% paid off</span><span>${payT - payN} payments left</span></div>
        </div>`;
    }).join('');

    // History table — oldest first
    const histRows = [...bills].reverse().map(b => {
      const bst = statusMap[b.bill_month];
      const cells = PEOPLE.map(p => {
        const ln = getLine(b, p);
        if (!ln) return '<td>—</td>';
        const hasOT = Math.abs(parseFloat(ln.one_time_amount || 0)) > 0.01;
        return `<td>${money(ln.total)}${hasOT ? '<span class="ot-flag">OT</span>' : ''}</td>`;
      }).join('');
      const jk   = (getTotal(b,'Jeff')||0) + (getTotal(b,'Koko')||0);
      const bill_total = parseFloat(b.account_total || 0);

      let statusCell;
      if (!bst) {
        statusCell = '<td>—</td>';
      } else if (bst.status === 'success') {
        statusCell = `<td><span class="status-ok">✓</span></td>`;
      } else {
        statusCell = `<td><span class="status-fail" title="${bst.error || 'Failed'}">✗</span></td>`;
      }

      return `<tr>
        <td class="td-month">${b.bill_month}</td>
        ${cells}
        <td class="td-venmo">${money(jk)}</td>
        <td class="td-total">${money(bill_total)}</td>
        ${statusCell}
      </tr>`;
    }).join('');

    app.innerHTML = `
      <div class="month-row">${pills}</div>
      ${errorBanner}

      <div class="venmo-hero">
        <div class="label">Venmo Zach${due ? ' · Due ' + due : ''}</div>
        <div class="big-amount">${money(venmo)}</div>
        <div class="breakdown">
          <strong>Jeff</strong> ${money(jeffAmt)} &nbsp;+&nbsp; <strong>Koko</strong> ${money(kokoAmt)}
        </div>
      </div>

      <div class="divider"></div>

      <div class="sh">This month</div>
      <div class="people-row">${personCells}</div>
      <p class="footnote" style="margin-bottom:8px;">Jeff &amp; Koko pay Zach · $20 military discount stays with Alex</p>

      <div class="divider"></div>

      <div class="sh">Device payments</div>
      ${deviceItems || '<p class="footnote">No active device payments this month.</p>'}

      <div class="divider"></div>

      <div class="sh">History</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Month</th>
              <th>Jeff</th><th>Koko</th><th>Zach</th><th>Alex</th><th>Beth</th>
              <th>J+K Venmo</th><th>Bill total</th><th>Status</th>
            </tr>
          </thead>
          <tbody>${histRows}</tbody>
        </table>
      </div>`;
  }

  window.go = function(i) { activeIdx = i; buildPage(i); };
  buildPage(0);
}

// Load data.json and status.json in parallel
Promise.all([
  fetch('./data/data.json').then(r => r.ok ? r.json() : { bills: [] }),
  fetch('./data/status.json').then(r => r.ok ? r.json() : { months: {} })
])
.then(([data, status]) => render(data.bills || [], status.months || {}))
.catch(() => render([], {}));
</script>
</body>
</html>
