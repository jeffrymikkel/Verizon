<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verizon — Larson/Calderwood</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, sans-serif;
      background: #F5F5F7;
      color: #1D1D1F;
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── Site header ── */
    .site-header {
      background: rgba(255,255,255,0.9);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding: 14px 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .site-header h1 { font-size: 15px; font-weight: 600; color: #1D1D1F; letter-spacing: -0.2px; }
    .site-header .sub { font-size: 12px; color: #6E6E73; }

    /* ── Layout ── */
    .main { padding: 24px 28px; }

    /* ── Table card ── */
    .table-wrap {
      overflow-x: auto;
      background: #fff;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    table { border-collapse: collapse; width: max-content; min-width: 100%; }

    /* Column headers */
    thead th {
      background: #F5F5F7;
      color: #6E6E73;
      padding: 10px 20px;
      text-align: right;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      border-bottom: 1px solid #E5E5EA;
      border-right: 1px solid #E5E5EA;
      line-height: 1.4;
    }
    thead th small {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: #9A9A9F;
      margin-top: 2px;
    }
    thead th.col-label {
      text-align: left;
      min-width: 192px;
      position: sticky;
      left: 0;
      z-index: 20;
      background: #F5F5F7;
      border-right: 1px solid #D2D2D7;
      color: #9A9A9F;
      font-weight: 400;
      font-size: 10px;
    }
    thead th.col-current { background: #EBF3FF; color: #0066CC; }
    thead th.col-current small { color: #5DA0E0; }

    /* Body cells */
    tbody td {
      padding: 5px 20px;
      text-align: right;
      white-space: nowrap;
      border-right: 1px solid #F2F2F7;
      border-bottom: 1px solid #F2F2F7;
      color: #1D1D1F;
      background: #fff;
      font-size: 12px;
    }
    tbody td.col-label {
      text-align: left;
      color: #6E6E73;
      font-size: 12px;
      position: sticky;
      left: 0;
      z-index: 10;
      background: #fff;
      border-right: 1px solid #D2D2D7;
      padding-left: 22px;
    }
    tbody td.col-current { background: #FAFCFF; }

    /* Person section header */
    tr.row-person td {
      background: #F9F9FB !important;
      color: #6E6E73 !important;
      font-size: 10px !important;
      font-weight: 600 !important;
      padding: 8px 20px 5px !important;
      border-top: 1px solid #E5E5EA !important;
      border-bottom: 1px solid #E5E5EA !important;
    }
    tr.row-person td.col-label {
      background: #F9F9FB !important;
      color: #1D1D1F !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      border-right: 1px solid #D2D2D7 !important;
    }
    tr.row-person:first-child td { border-top: none !important; }
    tr.row-person td.col-current { background: #EBF3FF !important; }

    /* Total row */
    tr.row-total td {
      font-weight: 600 !important;
      color: #1D1D1F !important;
      font-size: 13px !important;
      border-top: 1px solid #D2D2D7 !important;
      padding-top: 7px !important;
      padding-bottom: 7px !important;
      background: #fff !important;
    }
    tr.row-total td.col-label { color: #1D1D1F !important; }
    tr.row-total td.col-current { background: #FAFCFF !important; }

    /* Military discount */
    tr.row-military td {
      background: #F5FFF8 !important;
      color: #248A3D !important;
      font-size: 12px !important;
    }
    tr.row-military td.col-label {
      background: #F5FFF8 !important;
      color: #248A3D !important;
    }
    tr.row-military td.col-current { background: #F0FFF4 !important; }

    /* J&K Venmo */
    tr.row-venmo td {
      background: #EBF3FF !important;
      color: #0066CC !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      padding: 10px 20px !important;
      border-top: 1px solid #C4DCFF !important;
      border-bottom: 1px solid #C4DCFF !important;
    }
    tr.row-venmo td.col-label {
      background: #EBF3FF !important;
      color: #0066CC !important;
      font-size: 12px !important;
      font-weight: 500 !important;
      border-right: 1px solid #C4DCFF !important;
    }

    /* Spacer */
    tr.row-spacer td {
      background: #F5F5F7 !important;
      height: 6px;
      padding: 0;
      border: none;
    }

    /* Account total */
    tr.row-acct-total td {
      background: #F5F5F7 !important;
      color: #1D1D1F !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      padding: 10px 20px !important;
      border-top: 1px solid #D2D2D7 !important;
    }
    tr.row-acct-total td.col-label {
      background: #F5F5F7 !important;
      color: #1D1D1F !important;
      border-right: 1px solid #D2D2D7 !important;
    }
    tr.row-acct-total td.col-current {
      background: #EBF3FF !important;
      color: #0066CC !important;
    }

    /* ── Value styles ── */
    .v-neg    { color: #248A3D; }
    .v-dash   { color: #C7C7CC; }
    .v-orange { color: #BF5700; }
    .v-net    { font-weight: 600; }

    /* ── Info button (hover tooltip trigger) ── */
    .info-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #C7C7CC;
      color: #9A9A9F;
      font-size: 9px;
      font-style: italic;
      font-weight: 700;
      cursor: default;
      margin-left: 5px;
      vertical-align: middle;
      flex-shrink: 0;
      user-select: none;
    }
    .info-btn:hover {
      border-color: #0066CC;
      color: #0066CC;
    }

    /* ── Global floating tooltip (positioned via JS, lives on body) ── */
    #global-tip {
      position: fixed;
      display: none;
      background: #fff;
      color: #6E6E73;
      border: 1px solid #E5E5EA;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.5;
      padding: 6px 10px;
      border-radius: 7px;
      white-space: normal;
      word-break: break-word;
      z-index: 9999;
      pointer-events: none;
    }

    /* ── Device section ── */
    .devices-section h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6E6E73;
      margin-bottom: 12px;
    }
    .device-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .device-card {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 14px;
      padding: 16px 18px;
    }
    .dc-person    { font-weight: 600; font-size: 15px; color: #1D1D1F; margin-bottom: 2px; }
    .dc-device    { font-size: 12px; color: #6E6E73; margin-bottom: 14px; }
    .dc-bar-wrap  { background: #E5E5EA; border-radius: 99px; height: 5px; margin-bottom: 8px; overflow: hidden; }
    .dc-bar-fill  { background: #0066CC; border-radius: 99px; height: 5px; }
    .dc-meta      { display: flex; justify-content: space-between; font-size: 11px; color: #6E6E73; }
    .dc-remaining { color: #1D1D1F; font-weight: 600; }

    /* ── States ── */
    .state-msg { text-align: center; padding: 60px 20px; color: #6E6E73; font-size: 14px; }
  </style>
</head>
<body>

<div id="global-tip"></div>

<header class="site-header">
  <h1>Verizon — Larson/Calderwood</h1>
  <span class="sub">Family Plan · 223893379-00001</span>
</header>

<div class="main">
  <div id="state-loading" class="state-msg">Loading billing data…</div>
  <div id="state-error" class="state-msg" style="display:none">No billing data yet. Upload a PDF to inbox/ to get started.</div>

  <div id="dashboard" style="display:none">
    <div class="table-wrap">
      <table id="billing-table"></table>
    </div>
    <div class="devices-section">
      <h2>Device Payoff Progress</h2>
      <div class="device-grid" id="device-grid"></div>
    </div>
  </div>
</div>

<script>
'use strict';

const PERSONS = ['Jeff', 'Koko', 'Zach', 'Alex', 'Beth'];

const ROWS = [
  { key: 'plan',                 label: 'Plan',               fmt: 'text'          },
  { key: 'plan_base_cost',       label: 'Plan base',          fmt: 'money'         },
  { key: 'plan_rate_adjustment', label: 'Rate adj',           fmt: 'money', opt: true },
  { key: 'autopay_discount',     label: 'Autopay discount',   fmt: 'money'         },
  { key: 'net_plan_cost',        label: 'Net plan cost',      fmt: 'money'         },
  { key: 'device_combo',         label: 'Device payment',     fmt: 'device_combo', opt: true },
  { key: 'one_time_amount',      label: 'One-time',           fmt: 'onetime',      opt: true },
  { key: 'taxes_surcharges',     label: 'Taxes & surcharges', fmt: 'taxes'         },
  // military discount injected here for Alex only (see buildTable)
  { key: 'total',                label: 'Total',              fmt: 'money',        bold: true },
];

/* ── Floating tooltip (appended to body so it escapes table overflow) ── */
const tip = document.getElementById('global-tip');

document.addEventListener('mouseover', e => {
  const btn = e.target.closest('.info-btn');
  if (!btn) return;
  const text = btn.dataset.tip;
  if (!text) return;
  tip.textContent = text;
  const cell = btn.closest('td');
  tip.style.maxWidth = cell ? cell.getBoundingClientRect().width + 'px' : '260px';
  tip.style.display = 'block';
  placeTip(btn, cell);
});

document.addEventListener('mouseout', e => {
  if (e.target.closest('.info-btn')) tip.style.display = 'none';
});

function placeTip(btn, cell) {
  const r  = (cell || btn).getBoundingClientRect();
  const th = tip.offsetHeight;
  let left = r.left;
  let top  = r.top - th - 6;
  if (left < 4) left = 4;
  if (top  < 4) top  = r.bottom + 6;
  tip.style.left = left + 'px';
  tip.style.top  = top  + 'px';
}

/* ── Column header label ── */
function monthLabel(b) {
  const start = new Date(b.billing_period_start + 'T12:00:00Z');
  const end   = b.billing_period_end
    ? new Date(b.billing_period_end + 'T12:00:00Z')
    : new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + 1, 6));
  const mo   = { month: 'short', timeZone: 'UTC' };
  const full = { month: 'short', day: 'numeric', timeZone: 'UTC' };
  const label = start.toLocaleString('en-US', mo) + " '" + String(start.getUTCFullYear()).slice(2);
  const range = start.toLocaleDateString('en-US', full) + ' – ' + end.toLocaleDateString('en-US', full);
  return { label, range };
}

/* ── Formatters ── */
function fmtMoney(v, opt) {
  if (v === null || v === undefined || (opt && v === 0))
    return '<span class="v-dash">—</span>';
  const a = Math.abs(v).toFixed(2);
  return v < 0 ? `<span class="v-neg">($${a})</span>` : `$${a}`;
}

function fmtText(v, opt) {
  if (!v) return opt ? '<span class="v-dash">—</span>' : '';
  return String(v);
}

// Net device cost is the number; breakdown lives in an info tooltip
function fmtDeviceCombo(line) {
  const pmt = line?.device_payment;
  if (!pmt || pmt === 0) return '<span class="v-dash">—</span>';
  const credit = line?.trade_in_credit;
  const net    = line?.net_device_cost;
  if (credit && credit !== 0) {
    const creditAmt = Math.abs(credit).toFixed(2);
    const netAmt    = (net != null ? Math.abs(net) : Math.abs(pmt + credit)).toFixed(2);
    const tipText   = `$${pmt.toFixed(2)} device payment  ·  \u2212$${creditAmt} trade-in credit`;
    return `<span class="v-net">$${netAmt}</span><span class="info-btn" data-tip="${tipText}">i</span>`;
  }
  return `<span class="v-net">$${pmt.toFixed(2)}</span>`;
}

// Positive one-time = orange; negative = green; description in tooltip
function fmtOnetime(line) {
  const v = line?.one_time_amount;
  if (!v || v === 0) return '<span class="v-dash">—</span>';
  const a   = Math.abs(v).toFixed(2);
  const amt = v < 0
    ? `<span class="v-neg">($${a})</span>`
    : `<span class="v-orange">$${a}</span>`;
  const desc = line?.one_time_description;
  if (desc) {
    const safe = desc.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    return `${amt}<span class="info-btn" data-tip="${safe}">i</span>`;
  }
  return amt;
}

// Surcharges + taxes_gov_fees combined
function fmtTaxes(line) {
  const s = line?.surcharges     ?? 0;
  const t = line?.taxes_gov_fees ?? 0;
  const total = s + t;
  if (total === 0) return '<span class="v-dash">—</span>';
  return `$${total.toFixed(2)}`;
}

function cellVal(row, line) {
  if (!line) return '<span class="v-dash">—</span>';
  if (row.fmt === 'text')         return fmtText(line[row.key], row.opt);
  if (row.fmt === 'money')        return fmtMoney(line[row.key], row.opt);
  if (row.fmt === 'device_combo') return fmtDeviceCombo(line);
  if (row.fmt === 'onetime')      return fmtOnetime(line);
  if (row.fmt === 'taxes')        return fmtTaxes(line);
  return '—';
}

/* ── Table builder ── */
function buildTable(bills) {
  const n         = bills.length;
  const latestIdx = n - 1;

  function cc(i) {
    return i === latestIdx ? ' class="col-current"' : '';
  }

  let h = '<thead><tr><th class="col-label">Line item</th>';
  bills.forEach((b, i) => {
    const { label, range } = monthLabel(b);
    h += `<th${cc(i)}>${label}<small>${range}</small></th>`;
  });
  h += '</tr></thead><tbody>';

  const getLine = (bill, person) =>
    (bill.lines || []).find(l => l.person === person) || null;

  function spacer() {
    let r = '<tr class="row-spacer"><td class="col-label"></td>';
    for (let i = 0; i < n; i++) r += '<td></td>';
    return r + '</tr>';
  }

  PERSONS.forEach((person, pi) => {
    if (pi > 0) h += spacer();

    // Person header with last-4 of phone
    const refLine = getLine(bills[latestIdx], person);
    const phone   = refLine?.phone ?? '';
    const last4   = phone
      ? ` <small style="font-size:10px;color:#9A9A9F;font-weight:400;letter-spacing:0;text-transform:none">···${phone.slice(-4)}</small>`
      : '';
    h += `<tr class="row-person"><td class="col-label">${person}${last4}</td>`;
    bills.forEach((b, i) => h += `<td${cc(i)}></td>`);
    h += '</tr>';

    // Data rows
    ROWS.forEach(row => {
      const isTotalRow = row.key === 'total';

      // For Alex: inject military discount row immediately before Total
      if (person === 'Alex' && isTotalRow) {
        h += '<tr class="row-military"><td class="col-label">★ Military discount</td>';
        bills.forEach((b, i) => {
          const d = Math.abs(b.military_discount ?? 20).toFixed(2);
          h += `<td${cc(i)}><span class="v-neg">($${d})</span></td>`;
        });
        h += '</tr>';
      }

      h += `<tr${isTotalRow ? ' class="row-total"' : ''}>`;
      h += `<td class="col-label">${row.label}</td>`;
      bills.forEach((b, i) => {
        const line = getLine(b, person);
        let v;
        if (person === 'Alex' && isTotalRow) {
          const raw = line?.total ?? 0;
          const mil = b.military_discount ?? -20;
          const adj = raw + mil;
          v = `<strong>$${Math.max(adj, 0).toFixed(2)}</strong>`;
        } else {
          v = cellVal(row, line);
          if (isTotalRow) v = `<strong>${v}</strong>`;
        }
        h += `<td${cc(i)}>${v}</td>`;
      });
      h += '</tr>';
    });

    // J&K Venmo row — after Koko's section
    if (person === 'Koko') {
      h += '<tr class="row-venmo"><td class="col-label">💸 J&amp;K Venmo to Zach</td>';
      bills.forEach((b, i) => {
        const j = getLine(b, 'Jeff'), k = getLine(b, 'Koko');
        const total = ((j?.total ?? 0) + (k?.total ?? 0)).toFixed(2);
        h += `<td${cc(i)}>$${total}</td>`;
      });
      h += '</tr>';
    }
  });

  // Account total
  h += spacer();
  h += '<tr class="row-acct-total"><td class="col-label">Account total</td>';
  bills.forEach((b, i) => {
    h += `<td${cc(i)}><strong>$${parseFloat(b.account_total).toFixed(2)}</strong></td>`;
  });
  h += '</tr></tbody>';

  document.getElementById('billing-table').innerHTML = h;

  // Scroll to newest (rightmost) column
  const wrap = document.querySelector('.table-wrap');
  if (wrap) setTimeout(() => { wrap.scrollLeft = wrap.scrollWidth; }, 0);
}

/* ── Device payoff cards ── */
function buildDeviceCards(bills) {
  const latest = bills[bills.length - 1];
  if (!latest) return;
  const grid  = document.getElementById('device-grid');
  const lines = (latest.lines || []).filter(l => l.device_payment && l.device_payment > 0);
  if (!lines.length) {
    grid.innerHTML = '<p style="color:#9A9A9F;font-size:12px">No active device payments.</p>';
    return;
  }
  grid.innerHTML = lines.map(l => {
    const num = l.device_payment_number ?? 0;
    const tot = l.device_payment_total  ?? 1;
    const pct = ((num / tot) * 100).toFixed(1);
    const rem = l.device_balance_remaining != null
      ? '$' + parseFloat(l.device_balance_remaining).toFixed(2)
      : '—';
    return `<div class="device-card">
      <div class="dc-person">${l.person}</div>
      <div class="dc-device">${l.device ?? 'Device'}</div>
      <div class="dc-bar-wrap">
        <div class="dc-bar-fill" style="width:${Math.min(parseFloat(pct), 100)}%"></div>
      </div>
      <div class="dc-meta">
        <span>Payment ${num} of ${tot} &nbsp;·&nbsp; ${pct}%</span>
        <span class="dc-remaining">${rem} left</span>
      </div>
    </div>`;
  }).join('');
}

/* ── Bootstrap ── */
fetch('data/data.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(data => {
    document.getElementById('state-loading').style.display = 'none';
    const bills = (data.bills || []).slice().sort(
      (a, b) => new Date(a.billing_period_start) - new Date(b.billing_period_start)
    );
    if (!bills.length) {
      document.getElementById('state-error').style.display = 'block';
      return;
    }
    document.getElementById('dashboard').style.display = 'block';
    buildTable(bills);
    buildDeviceCards(bills);
  })
  .catch(() => {
    document.getElementById('state-loading').style.display = 'none';
    document.getElementById('state-error').style.display = 'block';
  });
</script>
</body>
</html>
