<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verizon · Family Plan</title>
<style>
  :root {
    --red: #0f0f0f;
    --bg: #fafafa;
    --surface: #ffffff;
    --text: #0f0f0f;
    --sub: #888888;
    --light: #f0f0f0;
    --border: #e8e8e8;
    --up: #c0392b;
    --down: #1a7f4b;
    --warn-bg: #fffbeb;
    --warn-text: #854d0e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Top bar ── */
  .topbar {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .topbar-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }
  .topbar-sub {
    font-size: 13px;
    color: var(--sub);
  }

  /* ── Page ── */
  .page { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }

  /* ── Month pills ── */
  .month-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 28px; }
  .month-pill {
    padding: 5px 13px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 13px;
    font-weight: 500;
    color: var(--sub);
    cursor: pointer;
    transition: all 0.1s;
  }
  .month-pill:hover { border-color: #bbb; color: var(--text); }
  .month-pill.active {
    background: var(--text);
    border-color: var(--text);
    color: #fff;
  }

  /* ── Venmo hero ── */
  .venmo-hero { margin-bottom: 36px; }
  .venmo-hero .label {
    font-size: 12px;
    font-weight: 500;
    color: var(--sub);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .venmo-hero .big-amount {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -3px;
    line-height: 1;
    color: var(--red);
    margin-bottom: 8px;
  }
  .venmo-hero .breakdown {
    font-size: 14px;
    color: var(--sub);
  }
  .venmo-hero .breakdown strong {
    color: var(--text);
    font-weight: 600;
  }

  /* ── Divider ── */
  .divider { height: 1px; background: var(--border); margin: 28px 0; }

  /* ── Section heading ── */
  .sh {
    font-size: 12px;
    font-weight: 600;
    color: var(--sub);
    letter-spacing: 0.04em;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  /* ── People row ── */
  .people-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  @media (min-width: 480px) { .people-row { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 680px) { .people-row { grid-template-columns: repeat(5, 1fr); } }

  .person-cell {
    background: var(--surface);
    padding: 16px 16px 14px;
  }
  .person-cell.hi { background: #fff9f9; }

  .pc-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--sub);
    margin-bottom: 5px;
  }
  .pc-amt {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.6px;
    line-height: 1.1;
    color: var(--text);
  }
  .pc-delta { font-size: 11px; margin-top: 5px; }
  .pc-delta.up { color: var(--up); }
  .pc-delta.down { color: var(--down); }
  .pc-delta.flat { color: var(--sub); }

  .ot-badge {
    display: inline-block;
    margin-top: 6px;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 10px;
    font-weight: 700;
    border-radius: 4px;
    padding: 2px 6px;
  }

  .footnote { font-size: 12px; color: var(--sub); }

  /* ── Device payments ── */
  .device-item {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .device-item:last-child { border-bottom: none; }
  .device-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    gap: 8px;
  }
  .device-who { font-weight: 700; font-size: 14px; }
  .device-model { font-size: 13px; color: var(--sub); margin-top: 1px; }
  .device-right { text-align: right; flex-shrink: 0; }
  .device-bal { font-size: 15px; font-weight: 700; color: var(--text); }
  .device-bal-sub { font-size: 11px; color: var(--sub); margin-top: 1px; }

  .bar-track {
    height: 4px;
    background: var(--light);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .bar-fill { height: 100%; background: var(--text); border-radius: 99px; }
  .bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); }

  /* ── History table ── */
  .table-wrap {
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
  thead th {
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--sub);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    background: #f7f7f7;
    white-space: nowrap;
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafafa; }
  .td-month { font-weight: 600; font-size: 13px; }
  .td-venmo { font-weight: 700; color: var(--red); }
  .td-total { color: var(--sub); }
  .ot-flag {
    display: inline-block;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 9px;
    font-weight: 700;
    border-radius: 3px;
    padding: 1px 4px;
    margin-left: 3px;
    vertical-align: middle;
  }

  /* ── Empty ── */
  .empty-state {
    padding: 60px 24px;
    text-align: center;
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .empty-state h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; color: var(--sub); margin-top: 6px; }
  .empty-state code { background: var(--light); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Verizon Family Plan</span>
  <span class="topbar-sub">223893379-00001</span>
</div>

<div class="page" id="app">
  <p style="color:#aaa;margin-top:12px;">Loading...</p>
</div>

<script>
// ── CSV parser ────────────────────────────────────────────────────────────────
function parseCSV(raw) {
  const lines = raw.trim().split('\n');
  const headers = splitLine(lines[0]);
  return lines.slice(1)
    .map(l => {
      const vals = splitLine(l);
      const obj = {};
      headers.forEach((h, i) => obj[h.trim()] = (vals[i] || '').trim());
      return obj;
    })
    .filter(r => r.person);
}
function splitLine(line) {
  const out = []; let cur = ''; let q = false;
  for (const ch of line) {
    if (ch === '"') { q = !q; }
    else if (ch === ',' && !q) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const money = n => '$' + Math.abs(parseFloat(n) || 0).toFixed(2);
function delta(cur, prev) {
  if (prev == null) return null;
  const d = parseFloat(cur) - parseFloat(prev);
  if (Math.abs(d) < 0.02) return { label: 'same as last month', cls: 'flat' };
  return d > 0
    ? { label: `+${money(d)} vs last month`, cls: 'up' }
    : { label: `-${money(d)} vs last month`, cls: 'down' };
}

// ── Render ────────────────────────────────────────────────────────────────────
const PEOPLE = ['Jeff', 'Koko', 'Zach', 'Alex', 'Beth'];

function render(allRows) {
  const app = document.getElementById('app');

  if (!allRows.length) {
    app.innerHTML = `
      <div class="empty-state">
        <h2>No data yet</h2>
        <p>Upload a monthly CSV to <code>data/</code> and add it to <code>data/manifest.json</code>.</p>
        <p style="margin-top:8px;">Claude Code generates both files from the Verizon PDF each month.</p>
      </div>`;
    return;
  }

  // Group by month
  const monthMap = {};
  allRows.forEach(r => {
    if (!monthMap[r.bill_month_label]) monthMap[r.bill_month_label] = [];
    monthMap[r.bill_month_label].push(r);
  });
  const monthKeys = Object.keys(monthMap).reverse();

  function getRow(rows, name)  { return rows.find(r => r.person === name) || null; }
  function getAmt(rows, name)  { const r = getRow(rows, name); return r ? parseFloat(r.total_line_charge || 0) : null; }

  function buildPage(idx) {
    const key   = monthKeys[idx];
    const mRows = monthMap[key];
    const prev  = idx + 1 < monthKeys.length ? monthMap[monthKeys[idx + 1]] : null;

    const jeffAmt  = getAmt(mRows, 'Jeff')  || 0;
    const kokoAmt  = getAmt(mRows, 'Koko')  || 0;
    const venmo    = jeffAmt + kokoAmt;
    const due      = (mRows[0] || {}).due_date || '';

    // Month pills
    const pills = monthKeys.map((k, i) =>
      `<button class="month-pill${i === idx ? ' active' : ''}" onclick="go(${i})">${k}</button>`
    ).join('');

    // Person cells
    const personCells = PEOPLE.map(p => {
      const tot = getAmt(mRows, p);
      if (tot === null) return '';
      const d = delta(tot, prev ? getAmt(prev, p) : null);
      const r = getRow(mRows, p);
      const hasOT = r && Math.abs(parseFloat(r.one_time_amount || 0)) > 0.01;
      const hi = p === 'Jeff' || p === 'Koko';
      return `
        <div class="person-cell${hi ? ' hi' : ''}">
          <div class="pc-name">${p}</div>
          <div class="pc-amt">${money(tot)}</div>
          ${d ? `<div class="pc-delta ${d.cls}">${d.label}</div>` : ''}
          ${hasOT ? `<span class="ot-badge">one-time</span>` : ''}
        </div>`;
    }).join('');

    // Device items
    const deviceItems = ['Jeff','Koko','Alex'].map(p => {
      const r = getRow(mRows, p);
      if (!r || !parseInt(r.device_payment_total)) return '';
      const payN = parseInt(r.device_payment_number) || 0;
      const payT = parseInt(r.device_payment_total)  || 36;
      const bal  = parseFloat(r.device_balance_remaining) || 0;
      const net  = parseFloat(r.net_device_cost) || 0;
      const pct  = Math.min(100, Math.round(payN / payT * 100));
      return `
        <div class="device-item">
          <div class="device-top">
            <div>
              <div class="device-who">${p}</div>
              <div class="device-model">${r.device_model} &nbsp;·&nbsp; ${money(net)}/mo net</div>
            </div>
            <div class="device-right">
              <div class="device-bal">${money(bal)}</div>
              <div class="device-bal-sub">remaining</div>
            </div>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-labels"><span>${pct}% paid off</span><span>${payT - payN} payments left</span></div>
        </div>`;
    }).join('');

    // History rows — oldest first
    const histRows = [...monthKeys].reverse().map(k => {
      const mr = monthMap[k];
      const cells = PEOPLE.map(p => {
        const r = getRow(mr, p);
        if (!r) return '<td>—</td>';
        const hasOT = Math.abs(parseFloat(r.one_time_amount || 0)) > 0.01;
        return `<td>${money(r.total_line_charge)}${hasOT ? '<span class="ot-flag">OT</span>' : ''}</td>`;
      }).join('');
      const jk = (getAmt(mr,'Jeff')||0) + (getAmt(mr,'Koko')||0);
      const acct = mr.find(r => r.person === 'ACCOUNT');
      const bill = mr.filter(r => r.person !== 'ACCOUNT')
                     .reduce((s,r) => s + parseFloat(r.total_line_charge||0), 0)
                   + (acct ? parseFloat(acct.total_line_charge||0) : 0);
      return `<tr>
        <td class="td-month">${k}</td>
        ${cells}
        <td class="td-venmo">${money(jk)}</td>
        <td class="td-total">${money(bill)}</td>
      </tr>`;
    }).join('');

    app.innerHTML = `
      <div class="month-row">${pills}</div>

      <div class="venmo-hero">
        <div class="label">Venmo Zach${due ? '  ·  Due ' + due : ''}</div>
        <div class="big-amount">${money(venmo)}</div>
        <div class="breakdown">
          <strong>Jeff</strong> ${money(jeffAmt)} &nbsp;+&nbsp; <strong>Koko</strong> ${money(kokoAmt)}
        </div>
      </div>

      <div class="divider"></div>

      <div class="sh">This month</div>
      <div class="people-row">${personCells}</div>
      <p class="footnote" style="margin-bottom:8px;">Jeff &amp; Koko pay Zach · $20 military discount stays with Alex</p>

      <div class="divider"></div>

      <div class="sh">Device payments</div>
      ${deviceItems || '<p class="footnote">No active device payments this month.</p>'}

      <div class="divider"></div>

      <div class="sh">History</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Month</th>
              <th>Jeff</th><th>Koko</th><th>Zach</th><th>Alex</th><th>Beth</th>
              <th>J+K Venmo</th><th>Bill total</th>
            </tr>
          </thead>
          <tbody>${histRows}</tbody>
        </table>
      </div>`;
  }

  window.go = function(i) { buildPage(i); };
  buildPage(0);
}

// ── Load via manifest ─────────────────────────────────────────────────────────
fetch('./data/manifest.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(m => Promise.all(
    (m.files || []).map(f =>
      fetch(`./data/${f}`).then(r => r.ok ? r.text() : '').then(t => t ? parseCSV(t) : [])
    )
  ))
  .then(arrays => render(arrays.flat()))
  .catch(() => render([]));
</script>
</body>
</html>
